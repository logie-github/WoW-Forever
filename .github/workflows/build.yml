name: Build WoW Forever

# Builds the app with Winlator (scripts/prepare-winlator.sh, cached by its pin and patches), runs the unit tests,
# and publishes every build as a GitHub release with the APK attached (wowforever-build-N).
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wowforever-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" \
            "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

      - name: Look for Winlator
        id: winlator
        uses: actions/cache/restore@v4
        with:
          path: app/winlator
          key: wf-winlator-v1-${{ hashFiles('winlator-version.env', 'patches/winlator/**', 'scripts/prepare-winlator.sh', 'scripts/winlator-rewrite.py') }}
      - name: Prepare Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-zstandard zstd > /dev/null
          scripts/prepare-winlator.sh
      - name: Save Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/winlator
          key: ${{ steps.winlator.outputs.cache-primary-key }}

      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon -PwfVersionCode=${{ github.run_number }} -PwfVersionName=2.0.${{ github.run_number }}
      - name: Build the APK
        run: ./gradlew :app:assembleDebug --no-daemon -PwfVersionCode=${{ github.run_number }} -PwfVersionName=2.0.${{ github.run_number }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk WoW-Forever.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wowforever-build-${{ github.run_number }}"
          gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="${{ github.sha }}" > /dev/null
          gh release create "$tag" WoW-Forever.apk --repo "${{ github.repository }}" --verify-tag --latest \
            --title "WoW Forever 2.0.${{ github.run_number }}" \
            --notes "Install WoW-Forever.apk on the phone. Built on Winlator 11.2 (brunodev85/winlator-app a030f55). Commit ${{ github.sha }}."
