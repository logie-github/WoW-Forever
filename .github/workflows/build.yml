name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty for a build only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch runtime components
        run: bash tools/fetch_components.sh

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build
        run: ./gradlew --no-daemon assembleModernRelease

      - name: Rename APK
        run: |
          apk=$(find app/build/outputs/apk/modern/release -name '*.apk' | head -n1)
          mv "$apk" WoW-Forever.apk

      - name: Input rule and touch control tests
        run: ./gradlew --no-daemon testModernDebugUnitTest --tests 'app.gamenative.wowinput.*' --tests 'app.gamenative.rules.*' --tests 'com.winlator.inputcontrols.BindingComboTest' --tests 'app.gamenative.data.TouchGestureConfigTest'

      - name: Release tag
        id: tag
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          if [ -z "${{ inputs.release_tag }}" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v$version" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Every build is published as a GitHub release with the APK attached: the release for the app's
      # versionName (v1.1.0...), replaced by later pushes until the version is bumped.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WoW Forever ${{ steps.tag.outputs.tag }}
          make_latest: true
          files: WoW-Forever.apk
